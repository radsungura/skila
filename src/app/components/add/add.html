<div class="container" >
    <h2 mat-dialog-title>
        Ajouter un Service
    </h2>
    <form [formGroup]="form">
      <div><mat-form-field appearance="outline" class="w-full">
        <mat-label>Nom</mat-label>
        <input [(ngModel)]="data.name" matInput formControlName="name" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Services</mat-label>
        <input [(ngModel)]="data.services" matInput formControlName="services" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Prix</mat-label>
        <input type="number" [(ngModel)]="data.price" matInput formControlName="price" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Date de début</mat-label>
        <input type="date" [(ngModel)]="data.start" matInput formControlName="start" required/>
      </mat-form-field>
       <mat-form-field appearance="outline" class="w-full">
        <mat-label>Note sur 10</mat-label>
        <input type="number" [(ngModel)]="data.rating" matInput formControlName="rating" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Statut</mat-label>
        <mat-select [(ngModel)]="data.status" formControlName="status" required>
          <mat-option value="active">✅ Actif</mat-option>
          <mat-option value="inactive">❌ Inactif</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
      
    <div>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Adresse</mat-label>
        <input [(ngModel)]="data.address" matInput formControlName="address" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Tel</mat-label>
        <input [(ngModel)]="data.tel" matInput formControlName="tel" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input type="email" [(ngModel)]="data.email" matInput formControlName="email" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Ville</mat-label>
        <input [(ngModel)]="data.city" matInput formControlName="city" required/>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Description</mat-label>
        <input [(ngModel)]="data.desc" matInput formControlName="desc" required/>
      </mat-form-field>
    </div>
      
    </form>
      <div class="flex justify-end mt-4" align="end">
        <button mat-button (click)="dialogRef.close()">Annuler</button>
        <button mat-raised-button color="btn-primary" (click)="add(data)">Ajouter</button>
      </div>
    @if(servererror) {
      <p style="color: red;">Une erreur est survenu !</p>
    }
</div>
