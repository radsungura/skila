<app-navbar></app-navbar>
<div class="providers-container">
    <div class="header-section">
        <!-- <mat-form-field class="search-bar">
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
        </mat-form-field> -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                providerholder="Rechercher un prestataire (nom, description, lieu...)"
                class="search-input"
                [value]="search"
                (input)="applyFilter($event)"
            />
            @if (search) {
                <button class="clear-btn" (click)="reset()">✕</button>
            }
        </div>
        <button mat-button (click)="add()" class="add-btn">+ Nouveau Service</button>
    </div>
    
  <!-- BARRE DE RECHERCHE & FILTRES -->
    <div class="search-section">
        <!-- <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input
            type="text"
            placeholder="Rechercher un prestataire (nom, description, lieu...)"
            class="search-input"
            [value]="searchTerm()"
            (input)="onSearchChange($event)"
        />
        @if (searchTerm()) {
            <button class="clear-btn" (click)="resetFilters()">✕</button>
        }
        </div> -->
        <div class="mat-elevation-z8">
            <table mat-table [dataSource]="dataSource" matSort class="mat-table">

                <!-- Position Column -->
                <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> No. </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Services </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <!-- Weight Column -->
                <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef> Prix </th>
                <td mat-cell *matCellDef="let element"> {{element.price}} </td>
                </ng-container>
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button (click)="edit(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="delete(element)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No data matching the filter "{{search}}"</td>
                </tr>
            </table>

            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
        </div>
    </div>
</div>
